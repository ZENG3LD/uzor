[workspace]
members = [
    # Font assets (published separately — large binary, rarely changes)
    "uzor-fonts",
    # Core library (contains render, animation, panels, panel_api, macos, layout, interactive, text_fx, cursor, numbers, scroll_fx)
    "uzor",
    # Platform
    "uzor-window-desktop",
    "uzor-desktop",
    "uzor-framework-macros",
    # App engine: kernel + single-writer engines + handle + hosts
    "uzor-framework",
    "uzor-window-web",
    "uzor-window-mobile",
    "uzor-tui",
    # Backends
    "uzor-render-vello-gpu",
    "uzor-render-vello-cpu",
    "uzor-render-vello-hybrid",
    "uzor-render-tiny-skia",
    "uzor-render-canvas2d",
    "uzor-render-wgpu-instanced",
    # Headless SVG serialization backend
    "uzor-render-svg",
    # URX render family (Phase 1+ — shared core, then siblings: wgpu/cpu/hybrid)
    "uzor-urx-core",
    "uzor-urx-cpu",
    "uzor-urx-wgpu",
    "uzor-urx-engine",
    "uzor-urx-hybrid",
    "uzor-urx-glyph",
    # URX image registry (Wave 4 — shared opaque ImageId -> decoded
    # premul RGBA8 store, mirrors the uzor-urx-glyph precedent)
    "uzor-urx-image",
    # URX full-GPU compute pipeline backend (v1.6 scaffold)
    "uzor-urx-wgpu-full",
    # URX 3D backend (native XYZ, perspective camera, depth pipeline — Wave 1+)
    "uzor-urx-3d",
    # URX 3D physics (Wave 15+16 — AABB/sphere colliders + dynamics)
    "uzor-urx-physics",
    # URX region mixer (Wave 9b — default MixDispatcher for engine)
    "uzor-urx-region-mixer",
    # URX render adapter — RC→Scene bridge so URX backends live in the
    # standard backend caralog. Phase A converter; Phase B is direct-Scene
    # consumer emit (no converter).
    "uzor-render-urx",
    # Utils
    "uzor-render-hub",
    # Icon utilities
    "uzor-icon",
    # GPU-first computer vision frontend (denoise + superpixels)
    "uzor-vision",
    # Raster → SVG tracer (inverse of uzor-icon)
    "uzor-vectorize",
    # Agent control plane (local HTTP API)
    "uzor-agent-api",
    # Reusable force-directed graph visualization engine
    "uzor-graph",
    # Headless render-to-file (PNG export, no window/GPU dependency)
    "uzor-export",
    # Data-figure engine core (scales/coord/marks/guides/figures)
    "uzor-figures",
    # Serde-able spec/IR registry for uzor-figures (authored .figure.json
    # content -> typed FigureSpec -> render)
    "uzor-figures-registry",
    # Pretext-pattern text layout engine (Arc 2 — plain text Phase 1)
    "uzor-text",
    # Typographic composition + slicing engine (Arc 4 — scene model, compose, pages/slides/frames)
    "uzor-typeset",
    # Dev-only multi-backend (tiny-skia/vello-cpu/urx-cpu) headless proof
    # harness — promoted out of uzor-examples/src/parity_harness.rs so
    # uzor-figures (and later uzor-text/uzor-typeset) can reach it as a
    # dev-dependency without a runtime dep in their own [dependencies].
    "uzor-proof-harness",
    # Layered demos
    "uzor-examples",
]
# A bare `cargo build` / `cargo test` at the root builds the light core only
# (no GPU, no windowing, no engines). Everything else is reached with `-p`.
default-members = [
    "uzor-fonts",
    "uzor",
    "uzor-text",
    "uzor-render-tiny-skia",
    "uzor-render-svg",
]
resolver = "2"

[workspace.package]
version = "1.6.0-dev"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZENG3LD"]
repository = "https://github.com/ZENG3LD/uzor"
homepage = "https://github.com/ZENG3LD/uzor"
keywords = ["ui", "rendering", "framework", "headless", "gpu"]
categories = ["gui", "rendering", "graphics"]

[workspace.dependencies]
# default-features = false: every member names the uzor features it uses
# (`shaper`, `serde`, `framework-png`, `testing`), so no member silently
# builds `image` just because it sits in this workspace.
uzor = { version = "1.6.0-dev", path = "./uzor", default-features = false }
uzor-fonts = { version = "1.6.0-dev", path = "./uzor-fonts" }
uzor-render-hub = { version = "1.6.0-dev", path = "./uzor-render-hub" }
uzor-render-vello-gpu = { version = "1.6.0-dev", path = "./uzor-render-vello-gpu" }
uzor-render-vello-hybrid = { version = "1.6.0-dev", path = "./uzor-render-vello-hybrid" }
uzor-render-vello-cpu = { version = "1.6.0-dev", path = "./uzor-render-vello-cpu" }
uzor-render-tiny-skia = { version = "1.6.0-dev", path = "./uzor-render-tiny-skia" }
uzor-render-svg = { version = "1.6.0-dev", path = "./uzor-render-svg" }
uzor-render-wgpu-instanced = { version = "1.6.0-dev", path = "./uzor-render-wgpu-instanced" }
uzor-render-canvas2d = { version = "1.6.0-dev", path = "./uzor-render-canvas2d" }
uzor-window-desktop = { version = "1.6.0-dev", path = "./uzor-window-desktop" }
uzor-icon = { version = "1.6.0-dev", path = "./uzor-icon" }
uzor-vision = { version = "1.6.0-dev", path = "./uzor-vision" }
uzor-vectorize = { version = "1.6.0-dev", path = "./uzor-vectorize" }
uzor-window-web = { version = "1.6.0-dev", path = "./uzor-window-web" }
uzor-window-mobile = { version = "1.6.0-dev", path = "./uzor-window-mobile" }
uzor-framework-macros = { version = "1.6.0-dev", path = "./uzor-framework-macros" }
uzor-framework = { version = "1.6.0-dev", path = "./uzor-framework" }
uzor-desktop = { version = "1.6.0-dev", path = "./uzor-desktop" }
uzor-agent-api = { version = "1.6.0-dev", path = "./uzor-agent-api" }
uzor-graph = { version = "1.6.0-dev", path = "./uzor-graph" }
uzor-export = { version = "1.6.0-dev", path = "./uzor-export" }
uzor-figures = { version = "1.6.0-dev", path = "./uzor-figures" }
uzor-figures-registry = { version = "1.6.0-dev", path = "./uzor-figures-registry" }
uzor-text = { version = "1.6.0-dev", path = "./uzor-text" }
uzor-typeset = { version = "1.6.0-dev", path = "./uzor-typeset" }
uzor-urx-region-mixer = { version = "1.6.0-dev", path = "./uzor-urx-region-mixer" }
uzor-urx-core = { version = "1.6.0-dev", path = "./uzor-urx-core" }
uzor-urx-cpu  = { version = "1.6.0-dev", path = "./uzor-urx-cpu" }
uzor-urx-wgpu = { version = "1.6.0-dev", path = "./uzor-urx-wgpu" }
uzor-urx-engine = { version = "1.6.0-dev", path = "./uzor-urx-engine" }
uzor-urx-hybrid = { version = "1.6.0-dev", path = "./uzor-urx-hybrid" }
uzor-urx-glyph = { version = "1.6.0-dev", path = "./uzor-urx-glyph" }
uzor-urx-image = { version = "1.6.0-dev", path = "./uzor-urx-image" }
uzor-urx-wgpu-full = { version = "1.6.0-dev", path = "./uzor-urx-wgpu-full" }
uzor-urx-3d = { version = "1.6.0-dev", path = "./uzor-urx-3d" }
uzor-urx-physics = { version = "1.6.0-dev", path = "./uzor-urx-physics" }
uzor-render-urx = { version = "1.6.0-dev", path = "./uzor-render-urx" }
uzor-proof-harness = { version = "1.6.0-dev", path = "./uzor-proof-harness" }
serde = { version = "1.0", features = ["derive"] }

