[package]
name = "uzor-render-tiny-skia"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CPU rendering backend using tiny-skia"
readme = "../README.md"

[dependencies]
uzor = { workspace = true, features = ["shaper"] }
tiny-skia = "0.11"
fontdue = "0.9"

[dev-dependencies]
# examples/icon_sheet.rs only — parses the icon design JSON.
serde = { workspace = true }
serde_json = "1.0"
uzor = { workspace = true, features = ["testing"] }

[features]
# `tiny-skia = "0.11"`'s own `png-format` default feature already ships
# `Pixmap::decode_png`/`load_png`/`save_png` — no `dep:png` needed here.
golden = []
