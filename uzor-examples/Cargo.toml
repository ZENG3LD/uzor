[package]
name = "uzor-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Layered demos for uzor — L1 (raw input coordinator), L2 (context manager + widgets), L3 (layout manager + composites), L4 (App + WindowManager builder)."

[dependencies]
uzor                  = { workspace = true }
uzor-desktop          = { workspace = true }
uzor-framework-macros = { workspace = true }
uzor-graph            = { workspace = true }
uzor-render-hub       = { workspace = true }
uzor-render-vello-gpu = { workspace = true }
uzor-urx-core         = { workspace = true }
uzor-window-desktop   = { workspace = true }
uzor-viz              = { path = "../uzor-viz" }
uzor-export           = { path = "../uzor-export" }
vello                 = "0.9"
pollster              = "0.4"
winit                 = "0.30"
arboard               = "3"
serde_json            = "1"

[[bin]]
name = "l1-coord"
path = "src/l1/coord.rs"

[[bin]]
name = "l2-launcher"
path = "src/l2/launcher.rs"

[[bin]]
name = "l3-dashboard"
path = "src/l3/dashboard.rs"

[[bin]]
name = "l4-dashboard"
path = "src/l4/dashboard.rs"

# uzor-graph engine demo — synthetic clustered graph, live force
# settling, drag/zoom/pan, click->sidebar. See uzor-graph/RUN.md.
[[bin]]
name = "force-graph-demo"
path = "src/l4/force_graph_demo.rs"

# uzor-viz V1 figures demo — bars/curve/histogram grid, agent-driven
# reseed/theme/export. See uzor-viz/CLAUDE.md for the crate scope.
[[bin]]
name = "viz-charts-demo"
path = "src/l4/viz_charts_demo.rs"

# URX render-family profiling rigs (Phase 0+).
# Pinned reference scene + agent HTTP backend switch + FPS readout.
# Used to A/B every backend (vello_gpu, instanced_wgpu, vello_hybrid,
# vello_cpu, tiny_skia) on the same workload, scriptable via curl.
[[bin]]
name = "urx-smoke-instanced"
path = "src/urx/smoke_instanced.rs"
