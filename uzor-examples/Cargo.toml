[package]
name = "uzor-examples"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "L4 dashboard on uzor-framework (brief E1)."

[lib]
path = "src/lib.rs"

[dependencies]
uzor = { workspace = true }
uzor-framework = { workspace = true }

[features]
# Native host for the dashboard bin. Not a default feature: `cargo test`
# stays on the headless host and does not pull winit or a render backend.
native = ["uzor-framework/native"]

[[bin]]
name = "l4-dashboard"
path = "src/l4/dashboard.rs"
required-features = ["native"]
