[package]
name        = "uzor-urx-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "URX WGPU backend — consumes urx-core DrawCommand, dispatches to instanced-WGPU primitive pipelines (Quad SDF + Line capsule + Triangle + Text atlas). Wraps uzor-render-wgpu-instanced (the existing well-tested primitive crate) with the URX scene-consumer API + URX metrics."
keywords    = ["graphics", "rendering", "ui", "wgpu", "instanced"]
categories  = ["graphics", "rendering"]

[dependencies]
uzor-urx-core              = { workspace = true }
uzor-urx-glyph             = { workspace = true }
# Shared image registry (Wave 4 §0.4) — NOT optional, same reasoning as
# `uzor-urx-glyph`'s non-optional status above (design risk 7: a GPU 2D
# UI pipeline without image support isn't a realistic consumer).
uzor-urx-image             = { workspace = true }
uzor-render-wgpu-instanced = { workspace = true }
uzor                       = { workspace = true }
metrics = "0.24"
wgpu    = "29"
# kurbo/peniko come transitively through urx-core, but pin explicitly
# for clarity in the DrawCommand → InstancedRenderContext adapter.
kurbo = "0.13"
peniko = "0.6"
# Native-pipeline GPU resource plumbing (Wave 1) — raw instance buffers
# need Pod/Zeroable derives; typed renderer errors need thiserror (same
# major version as the sibling `uzor-urx-wgpu-full` crate).
bytemuck  = { version = "1", features = ["derive"] }
thiserror = "1"
# Path tessellation (Wave 1 Commit 3) — same version pin as the legacy
# crate (`uzor-render-wgpu-instanced/Cargo.toml:18-19`).
lyon_tessellation = "1.0"
lyon_path         = "1.0"
# Native glyph atlas rectangle packing (Wave 2 Commit 1) — same version
# pin as the legacy crate (`uzor-render-wgpu-instanced/Cargo.toml:17`).
# NOT optional (design risk 7): a GPU 2D UI pipeline without text
# support isn't a realistic consumer, unlike `uzor-urx-cpu`'s opt-in
# `glyph` feature (headless/export use cases can skip it).
etagere = "0.2"

[dev-dependencies]
# Headless-GPU parity harness (Wave 1) — same versions as the sibling
# `uzor-urx-3d`/`uzor-render-wgpu-instanced` headless test suites.
pollster = "0.4"
image    = { version = "0.25", default-features = false, features = ["png"] }
# The semantic reference the native pipeline is diffed against.
# `glyph` feature (Wave 2 Commit 3) — the parity harness's CPU side
# needs `uzor-urx-cpu`'s `GlyphRun` arm to actually rasterise (calls
# `uzor_urx_glyph::draw_glyph_run`); without it, that arm is a no-op
# (`backend.rs`'s `#[cfg(not(feature = "glyph"))]` branch just drops
# the command) and `parity_glyph_run_two_letters` would compare a
# blank CPU reference against real native glyphs.
uzor-urx-cpu = { workspace = true, features = ["glyph"] }
