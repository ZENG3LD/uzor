[package]
name = "uzor-figures-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Serde-able spec/IR registry for uzor-figures — authored .figure.json content -> typed FigureSpec -> render, one string-keyed dispatch at the kind level only."
publish = false

[dependencies]
uzor = { workspace = true }
uzor-figures = { path = "../uzor-figures" }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
uzor-export = { path = "../uzor-export" }
png = "0.17"
