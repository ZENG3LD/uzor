[package]
name = "uzor-text"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pretext-pattern text layout engine for uzor — greedy word-wrap, rich multi-run spans, InlineBox, and a mixed-run baseline pass over the cosmic-text shaper (Arc 2 Phase 1+2; kinetics/ascii/hyphenation land in later phases)."
publish = false

[dependencies]
# `shaper` is a hard, always-on dependency feature here (not an optional
# passthrough of this crate's own) — `CosmicShaper::headless()` calls
# `uzor::shaper::measure_glyphs_wrapped` directly, so cosmic-text is
# unconditionally required.
uzor = { workspace = true, features = ["shaper"] }
# Phase 4 (`ascii`): `GlitchLetter` (absorbed verbatim from uzor core's
# `ui::effects::text::cell_shader`) draws its glitch swap/spark rolls from
# `fastrand` directly — uzor core depends on the same crate (`uzor/Cargo.toml`)
# but never re-exported it, so this move needs its own pin. Same major
# version (2) as uzor core's own `fastrand = "2"` pin.
fastrand = "2"

[dev-dependencies]
uzor-export = { path = "../uzor-export" }
uzor-render-tiny-skia = { workspace = true }
png = "0.17"
