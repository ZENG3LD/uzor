[package]
name = "uzor-proof-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dev-only multi-backend (tiny-skia / vello-cpu / vello-gpu / urx-cpu / urx-gpu) headless proof-render harness: drives one RenderContext-driven draw closure through every available rasterizer backend (three CPU legs always, two GPU legs gracefully skipped when no adapter is available), reports pairwise pixel-diff fractions, and writes a labelled side-by-side composite PNG. Promoted out of uzor-examples/src/parity_harness.rs (URX Wave 6) so any publish = false engine crate (uzor-figures first) can reach it as a dev-dependency without adding a runtime dependency to its own [dependencies]."

[dependencies]
uzor = { workspace = true }
uzor-render-tiny-skia = { workspace = true }
uzor-render-vello-cpu = { workspace = true }
uzor-render-vello-gpu = { workspace = true }
uzor-render-urx = { workspace = true }
uzor-urx-core = { workspace = true }
# `glyph` — without it `uzor-urx-cpu`'s `DrawCommand::GlyphRun` arm
# silently no-ops (uzor-urx-cpu/src/backend.rs:111-115,147) and
# unrotated text would render as ENTIRELY MISSING on the urx-cpu leg —
# a harness misconfiguration masquerading as a real backend defect, not
# an actual divergence finding.
uzor-urx-cpu = { workspace = true, features = ["glyph"] }
uzor-urx-wgpu = { workspace = true }
png = "0.17"
# GPU legs (`render_vello_gpu`/`render_urx_wgpu`) — same version/feature
# spec `uzor-examples`'s own Cargo.toml already uses for the identical
# headless-device pattern (`uzor-examples/src/parity_harness.rs`,
# `uzor-urx-wgpu/tests/common/mod.rs`); reused verbatim, not reinvented.
vello = "0.9"
wgpu = "29"
pollster = "0.4"
# Scoped `metrics::with_local_recorder` capture of URX native-pipeline
# degrade counters (`uzor-urx-wgpu/src/encode.rs::degrade`,
# `uzor_urx_core::metrics_keys::KEY_RENDER_PRIMITIVES`) — same version
# `uzor-urx-core`/`uzor-urx-wgpu` already pin.
metrics = "0.24"
