[package]
name = "uzor-render-wgpu-instanced"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance instanced wgpu rendering backend"
readme = "../README.md"

[dependencies]
# `shaper` feature: this backend's own `TextMetrics::measure_text`/
# `text_bounds` delegate to `uzor::shaper` (cosmic-text) for real GPOS
# kerning — see context.rs's own divergence note on `measure_text_internal`.
# No new dependency cost: this crate already pulls in `cosmic-text`
# directly (below) for its own real glyph-atlas rasterization pipeline.
uzor = { workspace = true, features = ["shaper"] }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.12"
skrifa = "0.42"
etagere = "0.2"
lyon_tessellation = "1.0"
lyon_path = "1.0"

[dev-dependencies]
pollster = "0.4"

[[example]]
name = "primitives_demo"
